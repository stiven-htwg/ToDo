<style>
:root{
  --bg:#f1ebdf; --dots:#dcd4c3; --surface:#fcf9f3; --surface2:#f6f1e7; --ink:#2a2723; --ink2:#716b60; --line:#e3dbcc;
  --shadow:0 1px 0 rgba(0,0,0,.03),0 8px 20px -12px rgba(70,50,20,.3);
  --over:#b04f3a; --overbg:#f4dcd3; --today:#8f6410; --todaybg:#f6e6bd; --soon:#45688a; --soonbg:#dfe8f1;
  --p1:#7a9a7e; --p2:#d1a24a; --p3:#c8705a;
  --serif:"Black Han Sans","Do Hyeon","Impact","Arial Narrow",sans-serif;
  --sans:"Noto Sans KR",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
[data-theme=dark]{
  --bg:#1a1917; --dots:#272522; --surface:#262421; --surface2:#2d2a26; --ink:#ece6da; --ink2:#a0998c; --line:#3b3732;
  --shadow:0 8px 20px -12px rgba(0,0,0,.7);
  --over:#e58f78; --overbg:#43271f; --today:#e4bb5e; --todaybg:#413519; --soon:#92b4d6; --soonbg:#212f3c;
}
[data-theme=rose]{
  --bg:#eeb0bf; --dots:#e39cb1; --surface:#fbe2e8; --surface2:#f6c9d4; --ink:#5c1527; --ink2:#85404f; --line:#df8fa5;
  --shadow:0 1px 0 rgba(92,21,39,.04),0 8px 20px -12px rgba(92,21,39,.38);
  --over:#9b1c31; --overbg:#f9d2d6; --today:#7a4f0a; --todaybg:#f6e2b4; --soon:#2f4f78; --soonbg:#d9e4f1;
}
:root{color-scheme:light}
[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;display:flex;flex-direction:column;background:var(--bg);background-image:radial-gradient(var(--dots) 1px,transparent 1px);background-size:22px 22px;color:var(--ink);font:15px/1.45 var(--sans);-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0;-webkit-tap-highlight-color:transparent}
input,textarea,select{font:inherit;color:inherit}
.locked header.top,.locked main#board{display:none}

/* Header */
header.top{display:flex;align-items:center;gap:20px;flex-wrap:wrap;padding:20px 28px 10px}
.brandrow{position:relative;display:flex;align-items:center;gap:12px}
.brand h1{margin:0;font:400 30px/1 var(--serif);letter-spacing:.03em}
.brand .stats{margin-top:6px;color:var(--ink2);font-size:13.5px}
.who{display:inline-flex;align-items:center;gap:7px;padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:13.5px}
.who:hover{border-color:var(--ink2)}
.sd{width:8px;height:8px;border-radius:50%;background:var(--p1)}
.sd.pending{background:var(--p2)}
.sd.offline{background:var(--p3)}
.sd.local{background:var(--ink2)}
#whomenu{left:0;right:auto;top:42px;min-width:230px}
.syncinfo{padding:8px 10px;font-size:12.5px;color:var(--ink2)}
.tabs{display:flex;gap:4px;background:var(--surface2);border:1px solid var(--line);padding:4px;border-radius:999px}
.tabs button{padding:6px 14px;border-radius:999px;color:var(--ink2);font-weight:500;display:flex;gap:7px;align-items:center}
.tabs button.on{background:var(--ink);color:var(--bg)}
.tabs .n{font-size:11.5px;opacity:.75;font-variant-numeric:tabular-nums}
.spacer{flex:1}
.tools{display:flex;gap:8px;align-items:center;position:relative}
#q{width:170px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);outline:none;transition:.2s}
#q:focus{width:240px;border-color:var(--ink2)}
.ib{height:36px;min-width:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;gap:7px;font-size:13.5px}
.ib:hover{border-color:var(--ink2)}
.ib .dot{width:8px;height:8px;border-radius:50%;background:var(--p1)}
.ib.warn .dot{background:var(--p3)}
#bkmenu{position:absolute;right:0;top:44px;z-index:30}

/* Board */
main#board{flex:1;min-height:0;overflow:auto;padding:12px 28px 40px}
.cols{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,340px));gap:16px;align-items:start}
.col{background:var(--surface2);border:1px solid var(--line);border-top:4px solid var(--c,var(--ink2));border-radius:16px;display:flex;flex-direction:column;position:relative;min-width:0}
.colhead{display:flex;align-items:center;gap:8px;padding:14px 12px 6px 16px;position:relative}
.ctitle{flex:1;min-width:0;font:400 19px/1.2 var(--serif);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ctitle input,.pname input{width:100%;font:inherit;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:2px 6px;outline:none}
.count{font-size:12.5px;color:var(--ink2);font-variant-numeric:tabular-nums;white-space:nowrap}
.icon{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--ink2);font-size:18px;line-height:1;flex:none}
.icon:hover{background:var(--line);color:var(--ink)}
.icon.plus{background:var(--c);color:#fff;font-size:20px}
.icon.plus:hover{filter:brightness(1.08);background:var(--c)}
.prog{height:4px;margin:4px 16px 8px;background:var(--line);border-radius:4px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--c);border-radius:4px;transition:width .5s}
.list{padding:2px 10px 12px;min-height:64px;display:flex;flex-direction:column;gap:8px;border-radius:0 0 14px 14px}
.list.over{background:color-mix(in srgb,var(--c) 8%,transparent)}
.hint{color:var(--ink2);font-size:13.5px;text-align:center;padding:18px 10px}
.ph{height:40px;border:2px dashed var(--c);border-radius:12px;opacity:.5;flex:none}

/* Ruhige Fächer (nichts offen) als kleine Streifen */
.rest{margin-top:8px}
.restlabel{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);margin:26px 0 10px}
.pills{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.pill{--c:var(--ink2);position:relative;display:flex;align-items:center;gap:8px;padding:5px 6px 5px 14px;background:var(--surface2);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:999px;min-height:44px}
.pill.over{background:color-mix(in srgb,var(--c) 14%,var(--surface2));border-color:var(--c)}
.pname{font:400 16px/1.2 var(--serif);max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcheck{color:var(--c);font-weight:700;font-size:14px}
.pill .menu{top:46px;left:0;right:auto}
.ghostp{border:2px dashed var(--line);background:transparent;color:var(--ink2);padding:5px 16px;font-weight:500}
button.ghostp:hover{border-color:var(--ink2);color:var(--ink)}
.ghostp input{border:0;background:transparent;outline:none;font:400 16px var(--serif);width:180px}

/* Menu */
.menu{position:absolute;right:8px;top:48px;z-index:20;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 30px -10px rgba(0,0,0,.35);padding:6px;min-width:190px}
.menu button{display:block;width:100%;text-align:left;padding:8px 10px;border-radius:8px;font-size:14px}
.menu button:hover{background:var(--surface2)}
.menu .danger{color:var(--over)}
.sw{display:flex;gap:6px;flex-wrap:wrap;padding:8px 10px}
.swatch{width:20px!important;height:20px;border-radius:50%;border:2px solid transparent!important;padding:0!important}
.swatch.on{border-color:var(--ink)!important}

/* Task */
.task{--c:var(--ink2);position:relative;display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 8px 10px 12px;box-shadow:var(--shadow);transition:opacity .3s,transform .3s}
.task.p1{box-shadow:inset 3px 0 0 var(--p1),var(--shadow)}
.task.p2{box-shadow:inset 3px 0 0 var(--p2),var(--shadow)}
.task.p3{box-shadow:inset 3px 0 0 var(--p3),var(--shadow)}
.task[draggable=true]{cursor:grab}
.task.dragging{opacity:.35}
.check{flex:none;width:24px;height:24px;margin-top:0;border-radius:50%;border:2px solid var(--ink2);display:grid;place-items:center;color:#fff;transition:.2s}
.check:hover{border-color:var(--c);background:color-mix(in srgb,var(--c) 18%,transparent)}
.check svg{opacity:0}
.check path{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset .3s .05s}
.task.done .check,.task.completing .check{background:var(--c);border-color:var(--c)}
.task.done .check svg,.task.completing .check svg{opacity:1}
.task.done .check path,.task.completing .check path{stroke-dashoffset:0}
.task.completing{opacity:.55;transform:scale(.98)}
.task.completing .ttitle,.task.done .ttitle{text-decoration:line-through;color:var(--ink2)}
.task.done{box-shadow:none;background:transparent}
.tbody{flex:1;min-width:0;cursor:pointer}
.ttitle{font-weight:500;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.meta:empty{display:none}
.chip{font-size:12px;padding:1px 8px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);color:var(--ink2);white-space:nowrap}
.chip.sj{background:color-mix(in srgb,var(--c) 16%,transparent);border-color:transparent;color:var(--ink)}
.chip.over{background:var(--overbg);color:var(--over);border-color:transparent;font-weight:700}
.chip.today{background:var(--todaybg);color:var(--today);border-color:transparent;font-weight:700}
.chip.soon{background:var(--soonbg);color:var(--soon);border-color:transparent}
.tact{display:flex;flex-direction:column;opacity:0;transition:.15s}
.task:hover .tact,.task:focus-within .tact{opacity:1}
.tact button{width:28px;height:28px;border-radius:8px;color:var(--ink2);font-size:15px;display:grid;place-items:center}
.tact button:hover{background:var(--surface2);color:var(--ink)}
.detail{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);cursor:default}
.note{margin:0 0 8px;color:var(--ink2);font-size:14px;overflow-wrap:anywhere}
.note a{color:var(--soon)}
.sub{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:14px}
.sub input{accent-color:var(--c);width:17px;height:17px;margin:0}
.sub span{flex:1;overflow-wrap:anywhere}
.sub.sd span{text-decoration:line-through;color:var(--ink2)}
.sub .x{color:var(--ink2);opacity:0;width:24px;height:24px}
.sub:hover .x{opacity:1}
.subadd{width:100%;margin-top:4px;border:0;border-bottom:1px solid var(--line);background:transparent;padding:6px 0;outline:none;font-size:14px}
.subadd:focus{border-color:var(--c)}

/* Fällig-Ansicht */
.soon-wrap{max-width:720px;margin:0 auto}
.soon-wrap h3{font:400 18px var(--serif);margin:22px 0 10px;display:flex;align-items:center;gap:10px}
.soon-wrap h3 small{font:13px var(--sans);color:var(--ink2)}
.soon-wrap h3.over{color:var(--over)}
.stack{display:flex;flex-direction:column;gap:8px}
.foot{color:var(--ink2);font-size:13px;margin-top:22px;text-align:center}

.empty{max-width:420px;margin:12vh auto 0;text-align:center}
.empty h2{font:400 26px var(--serif);margin:0 0 8px}
.empty p{color:var(--ink2);margin:0 0 20px}
.empty .pill{margin:20px auto 0;width:fit-content}

.primary{background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700}
.primary:hover{opacity:.9}
.primary:disabled{opacity:.5;cursor:default}
.secondary{padding:10px 16px;border-radius:999px;color:var(--ink2)}
.secondary:hover{color:var(--ink)}

/* Login */
#login{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:20px;background:var(--bg);background-image:radial-gradient(var(--dots) 1px,transparent 1px);background-size:22px 22px}
#login[hidden]{display:none}
.lcard{width:min(380px,100%);background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:28px;box-shadow:0 30px 70px -30px rgba(0,0,0,.4);display:flex;flex-direction:column;gap:14px}
.lcard h1{margin:0;font:400 34px/1 var(--serif);letter-spacing:.03em}
.lcard p{margin:0;color:var(--ink2)}
.lquick{display:flex;gap:8px}
.lquick button{flex:1;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);font:400 17px var(--serif)}
.lquick button:hover,.lquick button.on{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.lcard input{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:11px 13px;outline:none;font-size:16px}
.lcard input:focus{border-color:var(--ink2)}
#l_err{color:var(--over);font-size:13.5px;min-height:1.2em}

/* Dialog */
dialog{border:1px solid var(--line);border-radius:18px;padding:0;background:var(--surface);color:var(--ink);width:min(480px,94vw);box-shadow:0 30px 70px -20px rgba(0,0,0,.5)}
dialog::backdrop{background:rgba(20,15,5,.4);backdrop-filter:blur(2px)}
dialog form{padding:22px;display:flex;flex-direction:column;gap:14px}
dialog h2{margin:0;font:400 22px var(--serif)}
dialog label.l{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--ink2)}
dialog input[type=text],dialog input[type=date],dialog select,dialog textarea{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 11px;outline:none;color:var(--ink);font-size:15px}
dialog input:focus,dialog select:focus,dialog textarea:focus{border-color:var(--ink2)}
#f_title{font-size:17px!important;font-weight:500}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.quick button{font-size:12px;padding:3px 11px;border-radius:999px;border:1px solid var(--line);color:var(--ink2)}
.quick button:hover{color:var(--ink);border-color:var(--ink2)}
.prio{border:0;padding:0;margin:0;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.prio legend{font-size:12.5px;color:var(--ink2);margin-bottom:5px;padding:0;float:left;width:100%}
.prio label{cursor:pointer}
.prio input{position:absolute;opacity:0}
.prio span{display:block;padding:5px 12px;border-radius:999px;border:1px solid var(--line);font-size:13px;color:var(--ink2)}
.prio input:checked+span{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.prio input:focus-visible+span{outline:2px solid var(--soon)}
.dact{display:flex;justify-content:flex-end;gap:8px;margin-top:4px}

/* Gemeinsame Kachel (Essensplan) */
.shsub{font-size:12.5px;color:var(--ink2);padding:0 16px 8px;margin-top:-2px}
.linkb{color:var(--ink2);text-decoration:underline;text-underline-offset:3px;font-size:12.5px}
.linkb:hover{color:var(--ink)}
.meals{padding:2px 10px 8px;display:flex;flex-direction:column;gap:6px}
.meal{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:5px 8px 5px 12px;min-height:46px}
.mlabel{font:400 13px var(--serif);letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);width:66px;flex:none}
.mtext{flex:1;min-width:0;text-align:left;font-weight:500;overflow-wrap:anywhere;padding:6px 0}
.mtext.empty{color:var(--ink2);font-weight:400;font-size:14px}
.shedit{flex:1;min-width:0;border:0;border-bottom:1px solid var(--c);background:transparent;outline:none;padding:6px 0;font-weight:500}
.chip.newc{background:var(--todaybg);color:var(--today);border-color:transparent;font-weight:700;cursor:pointer}
.stasks{padding:0 10px 6px;display:flex;flex-direction:column;gap:6px}
.stask{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 6px 9px 12px;box-shadow:var(--shadow)}
.stask.sdone{box-shadow:none;background:transparent}
.stask.sdone .check{background:var(--c);border-color:var(--c)}
.stask.sdone .check svg{opacity:1}
.stask.sdone .check path{stroke-dashoffset:0}
.sbody{flex:1;min-width:0}
.stitle{display:block;text-align:left;font-weight:500;overflow-wrap:anywhere;width:100%;padding:0}
.stask.sdone .stitle{text-decoration:line-through;color:var(--ink2)}
.sx{width:28px;height:28px;border-radius:8px;color:var(--ink2);font-size:16px;display:grid;place-items:center;flex:none}
.sx:hover{background:var(--surface2);color:var(--ink)}
.shmore{display:block;margin:2px 14px 8px;font-size:12.5px;color:var(--ink2);text-decoration:underline;text-underline-offset:3px}
.shadd{display:block;width:calc(100% - 28px);margin:2px 14px 14px;border:0;border-bottom:1px solid var(--line);background:transparent;padding:8px 0;outline:none}
.shadd:focus{border-color:var(--c)}

/* Toast */
#toast{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));transform:translate(-50%,30px);opacity:0;pointer-events:none;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;display:flex;gap:14px;align-items:center;font-size:14px;transition:.25s;z-index:150;box-shadow:0 10px 30px -10px rgba(0,0,0,.5);max-width:92vw}
#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{font-weight:700;text-decoration:underline;text-underline-offset:3px}

/* App-Modus: Abstand zu Notch/Statusleiste */
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* Touch-Geräte: Knöpfe immer sichtbar, 16px gegen iOS-Zoom */
@media (hover:none){
  .tact{opacity:1}
  .sub .x{opacity:1}
  input,textarea,select{font-size:16px!important}
}
@media (max-width:640px){
  header.top{padding:14px 16px 6px;gap:12px}
  main#board{padding:10px 16px 40px}
  .cols{grid-template-columns:1fr}
  #q{width:130px}#q:focus{width:170px}
  .brand h1{font-size:26px}
}
</style>
</head>
<body>

<div id="login" hidden>
  <form class="lcard" id="lf" autocomplete="on">
    <h1>Lernboard</h1>
    <p>Wer bist du?</p>
    <div class="lquick" id="l_quick"></div>
    <input type="text" id="l_name" name="username" autocomplete="username" placeholder="Name" autocapitalize="words" autocorrect="off" spellcheck="false">
    <input type="password" id="l_code" name="password" autocomplete="current-password" placeholder="Code">
    <div id="l_err" role="alert"></div>
    <button type="submit" class="primary" id="l_btn">Rein</button>
  </form>
</div>

<header class="top">
  <div class="brand">
    <div class="brandrow">
      <h1>Lernboard</h1>
      <button class="who" id="who" data-act="whomenu" aria-label="Profil"><span class="sd" id="sdot"></span><span id="whoname">Lokal</span><span aria-hidden="true">▾</span></button>
      <div class="menu" id="whomenu" hidden>
        <div class="syncinfo" id="syncinfo"></div>
        <button class="danger" id="logoutbtn" data-act="logout">Abmelden</button>
      </div>
    </div>
    <div class="stats" id="stats"></div>
  </div>
  <nav class="tabs" id="tabs">
    <button data-tab="aktiv">Aktiv <span class="n" id="n_aktiv"></span></button>
    <button data-tab="faellig">Bald fällig <span class="n" id="n_faellig"></span></button>
    <button data-tab="erledigt">Erledigt <span class="n" id="n_erledigt"></span></button>
  </nav>
  <div class="spacer"></div>
  <div class="tools">
    <input id="q" type="search" placeholder="Suchen   ( / )" autocomplete="off">
    <button class="ib" id="theme" title="Design wechseln: Hell, Dunkel, Rosa" aria-label="Design wechseln">☾</button>
    <button class="ib" id="bk" data-act="bkmenu"><span class="dot"></span><span id="bklabel">Backup</span></button>
    <div class="menu" id="bkmenu" hidden>
      <button data-act="export">Backup herunterladen</button>
      <button data-act="import">Backup einspielen …</button>
    </div>
    <input type="file" id="file" accept=".json,application/json" hidden>
  </div>
</header>

<main id="board"></main>

<dialog id="dlg">
  <form id="tf" autocomplete="off">
    <h2 id="dlgtitle">Neue Aufgabe</h2>
    <input type="text" id="f_title" placeholder="Was ist zu tun?" maxlength="200">
    <div class="two">
      <label class="l">Fach<select id="f_subj"></select></label>
      <label class="l">Deadline<input type="date" id="f_due"></label>
    </div>
    <div class="quick" style="margin-top:-6px">
      <button type="button" data-q="0">Heute</button>
      <button type="button" data-q="1">Morgen</button>
      <button type="button" data-q="7">In 1 Woche</button>
      <button type="button" data-q="">Ohne</button>
    </div>
    <fieldset class="prio">
      <legend>Priorität</legend>
      <label><input type="radio" name="prio" value="0" checked><span>Keine</span></label>
      <label><input type="radio" name="prio" value="1"><span>Niedrig</span></label>
      <label><input type="radio" name="prio" value="2"><span>Mittel</span></label>
      <label><input type="radio" name="prio" value="3"><span>Hoch</span></label>
    </fieldset>
    <label class="l">Notiz<textarea id="f_note" rows="4" placeholder="Optional. Links werden anklickbar. (Strg+Enter speichert)"></textarea></label>
    <div class="dact">
      <button type="button" class="secondary" id="f_cancel">Abbrechen</button>
      <button type="submit" class="primary">Speichern</button>
    </div>
  </form>
</dialog>

<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
'use strict';
const CFG=window.LERNBOARD_CONFIG||{};
const PROFILES=CFG.PROFILES||[];
const CONFIGURED=!!(CFG.SUPABASE_URL&&CFG.SUPABASE_ANON_KEY);
const KEY='lernboard_v1', DEVKEY='lernboard_dev', LASTNAME='lernboard_lastname';
const COLORS=['#7a9a7e','#c8705a','#d1a24a','#6b8cae','#9a6b8e','#4f9a94','#cf8a96','#7c8594'];
const WD=['So','Mo','Di','Mi','Do','Fr','Sa'];
const MONTHS=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const WDL=['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
const CHEERS=['Erledigt.','Ein Ding weniger im Kopf.','Sauber.','Geschafft - weiter so.','Stark.'];
const CAN_DRAG=!!(window.matchMedia&&matchMedia('(hover:hover) and (pointer:fine)').matches);
const $=s=>document.querySelector(s);
const THEMES=['light','dark','rose'];
const TLABEL={light:'☀ Hell',dark:'☾ Dunkel',rose:'♡ Rosa'};
const TCOLOR={light:'#f1ebdf',dark:'#1a1917',rose:'#eeb0bf'};

/* ---------- State ---------- */
const blank=()=>({subjects:[],tasks:[]});
let MODE='local';            // 'local' (ohne Supabase) oder 'remote'
let S=blank();               // geteilte Daten: Fächer + Aufgaben
const DEV=loadDev();         // nur dieses Gerät: Theme, Tab, letztes Backup
let sb=null, session=null, uid=null, whoName='Lokal', cacheKey=null, remoteTs=null;
let dirty=false, pushing=false, again=false, pushT=null, retryT=null;
let syncState='ok', syncAt=null;
const ui={tab:DEV.tab||'aktiv',q:'',expanded:new Set(),menu:null,addingSubject:false,renaming:null,focusSub:null,editing:null};
let undoSnap=null, toastTimer=null, lastDay=todayStr();
const SHKEY='lernboard_shared_cache', SHPEND='lernboard_shared_pending', SHSEEN='lernboard_shared_seen';
let SH={}, shPend={}, shLoaded=false, shBusy=false, shAgain=false, shPulling=false, shMissing=false, shSeen=0, shSeenFresh=false, shTimer=null, shRetry=null, shChan=null, shDel=null;
ui.shEdit=null; ui.shFocusNew=false; ui.shDone=false;

function loadLocal(){
  try{const r=localStorage.getItem(KEY); if(r){const d=JSON.parse(r); return {subjects:d.subjects||[],tasks:d.tasks||[]};}}catch(e){}
  return blank();
}
function loadDev(){
  let d={};
  try{d=JSON.parse(localStorage.getItem(DEVKEY)||'null')||{};}catch(e){}
  try{ // Übernahme alter Einstellungen aus der ersten Version
    const o=JSON.parse(localStorage.getItem(KEY)||'null');
    if(o){ if(d.theme===undefined)d.theme=o.theme; if(!d.tab)d.tab=o.tab; if(d.lastBackup===undefined)d.lastBackup=o.lastBackup; }
  }catch(e){}
  return Object.assign({theme:null,tab:'aktiv',lastBackup:null},d);
}
function saveDev(){try{localStorage.setItem(DEVKEY,JSON.stringify(DEV));}catch(e){}}
const pay=()=>({subjects:S.subjects,tasks:S.tasks});
function setDirty(v){
  dirty=v;
  if(cacheKey){try{if(v)localStorage.setItem(cacheKey+'_dirty','1'); else localStorage.removeItem(cacheKey+'_dirty');}catch(e){}}
}
function save(){
  if(MODE==='remote'){
    try{localStorage.setItem(cacheKey,JSON.stringify(pay()));}catch(e){}
    setDirty(true); setSync('pending');
    clearTimeout(pushT); pushT=setTimeout(push,600);
  }else{
    try{localStorage.setItem(KEY,JSON.stringify(pay()));}catch(e){}
  }
}

/* ---------- Helpers ---------- */
function uidGen(){return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmtDate(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function todayStr(){return fmtDate(new Date());}
function parse(s){const p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);}
function diffDays(s){return Math.round((parse(s)-parse(todayStr()))/86400000);}
function addDays(n){const d=new Date();d.setDate(d.getDate()+n);return fmtDate(d);}
function dm(s){const d=parse(s);return String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0')+'.';}
function dueInfo(s){
  if(!s) return null;
  const n=diffDays(s), wd=WD[parse(s).getDay()];
  if(n<0) return {txt:n===-1?'gestern fällig':'überfällig seit '+(-n)+' Tagen',cls:'over'};
  if(n===0) return {txt:'heute',cls:'today'};
  if(n===1) return {txt:'morgen',cls:'soon'};
  if(n<=7) return {txt:wd+' · in '+n+' Tagen',cls:n<=3?'soon':''};
  return {txt:wd+' '+dm(s),cls:''};
}
function shortTs(ts){
  const n=diffDays(fmtDate(new Date(ts)));
  return n===0?'heute':n===-1?'gestern':dm(fmtDate(new Date(ts)));
}
function linkify(t){return esc(t).replace(/\n/g,'<br>').replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>');}
const subj=id=>S.subjects.find(s=>s.id===id);
const taskById=id=>S.tasks.find(t=>t.id===id);
function match(t){
  const q=ui.q.trim().toLowerCase(); if(!q) return true;
  return (t.title+' '+(t.note||'')+' '+(t.subs||[]).map(s=>s.t).join(' ')).toLowerCase().includes(q);
}

/* ---------- Undo / Toast ---------- */
function snap(){undoSnap=JSON.stringify(pay());}
function undo(){
  if(!undoSnap) return;
  const d=JSON.parse(undoSnap); S.subjects=d.subjects; S.tasks=d.tasks; undoSnap=null;
  save(); hideToast(); render();
}
function toast(msg,withUndo,uact){
  const el=$('#toast');
  el.innerHTML='<span>'+esc(msg)+'</span>'+(withUndo?'<button data-act="'+(uact||'undo')+'">Rückgängig</button>':'');
  el.classList.add('show'); clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>{hideToast(); if(withUndo) undoSnap=null;},withUndo?7000:3000);
}
function hideToast(){$('#toast').classList.remove('show');}

/* ---------- Sync-Status ---------- */
function setSync(s){syncState=s; if(s==='ok')syncAt=Date.now(); updateSync();}
function updateSync(){
  const d=$('#sdot'); if(!d) return;
  if(MODE!=='remote'){
    d.className='sd local';
    $('#syncinfo').textContent='Nur auf diesem Gerät gespeichert (Supabase noch nicht eingerichtet).';
    return;
  }
  d.className='sd '+syncState;
  const t=syncAt?new Date(syncAt).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}):'';
  $('#syncinfo').textContent=syncState==='ok'?'Synchronisiert'+(t?' · '+t:''):syncState==='pending'?'Speichert …':'Offline - Änderungen werden nachgeholt.';
}

/* ---------- Rendering ---------- */
function taskHTML(t,o){
  o=o||{};
  const sj=subj(t.subjectId), color=sj?sj.color:'var(--ink2)';
  const due=!t.done?dueInfo(t.due):null;
  const subs=t.subs||[], sd=subs.filter(s=>s.done).length;
  const open=ui.expanded.has(t.id);
  let detail='';
  if(open){
    detail='<div class="detail">'+
      (t.note?'<p class="note">'+linkify(t.note)+'</p>':'')+
      subs.map(s=>'<label class="sub '+(s.done?'sd':'')+'"><input type="checkbox" data-act="sub-toggle" data-sub="'+s.id+'" '+(s.done?'checked':'')+'><span>'+esc(s.t)+'</span><button class="x" type="button" data-act="sub-del" data-sub="'+s.id+'" aria-label="Entfernen">×</button></label>').join('')+
      (!t.done?'<input class="subadd" data-subadd placeholder="Unteraufgabe hinzufügen …" maxlength="150">':'')+
    '</div>';
  }
  return '<article class="task p'+(t.prio||0)+(t.done?' done':'')+'" data-id="'+t.id+'" style="--c:'+color+'" '+(o.drag&&CAN_DRAG?'draggable="true"':'')+'>'+
    '<button class="check" data-act="'+(t.done?'reopen':'toggle')+'" aria-label="'+(t.done?'Wieder öffnen':'Als erledigt markieren')+'"><svg viewBox="0 0 24 24" width="13" height="13"><path pathLength="1" d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>'+
    '<div class="tbody" data-act="expand">'+
      '<div class="ttitle">'+esc(t.title)+'</div>'+
      '<div class="meta">'+
        (o.showSubject&&sj?'<span class="chip sj">'+esc(sj.name)+'</span>':'')+
        (due?'<span class="chip '+due.cls+'">'+due.txt+'</span>':'')+
        (t.done&&t.doneAt?'<span class="chip">erledigt '+shortTs(t.doneAt)+'</span>':'')+
        (subs.length?'<span class="chip">'+sd+'/'+subs.length+'</span>':'')+
        (t.note&&!open?'<span class="chip">Notiz</span>':'')+
      '</div>'+detail+
    '</div>'+
    '<div class="tact">'+
      (!t.done?'<button data-act="edit" title="Bearbeiten" aria-label="Bearbeiten">✎</button>':'')+
      '<button data-act="del" title="Löschen" aria-label="Löschen">×</button>'+
    '</div>'+
  '</article>';
}

function menuHTML(sj){
  if(ui.menu!==sj.id) return '';
  return '<div class="menu"><button data-act="rename">Umbenennen</button><div class="sw">'+COLORS.map(c=>'<button class="swatch'+(c===sj.color?' on':'')+'" style="background:'+c+'" data-act="color" data-color="'+c+'" aria-label="Farbe"></button>').join('')+'</div><button class="danger" data-act="del-subject">Fach löschen</button></div>';
}
function nameHTML(sj){
  return ui.renaming===sj.id?'<input id="rn" data-rename value="'+esc(sj.name)+'" maxlength="40">':esc(sj.name);
}

function colHTML(sj){
  const all=S.tasks.filter(t=>t.subjectId===sj.id);
  const open=all.filter(t=>!t.done), dn=all.length-open.length;
  const shown=open.filter(match);
  const pct=all.length?Math.round(dn/all.length*100):0;
  return '<section class="col" data-sid="'+sj.id+'" style="--c:'+sj.color+'">'+
    '<header class="colhead"><div class="ctitle">'+nameHTML(sj)+'</div>'+
      '<span class="count">'+open.length+' offen</span>'+
      '<button class="icon" data-act="menu" aria-label="Fach-Menü">⋯</button>'+
      '<button class="icon plus" data-act="add-task" aria-label="Aufgabe hinzufügen">+</button>'+
      menuHTML(sj)+
    '</header>'+
    '<div class="prog" title="'+pct+'% erledigt"><i style="width:'+pct+'%"></i></div>'+
    '<div class="list" data-sid="'+sj.id+'">'+
      (shown.length?shown.map(t=>taskHTML(t,{drag:true})).join(''):'<div class="hint">Nichts gefunden.</div>')+
    '</div>'+
  '</section>';
}

function pillHTML(sj){
  const hasDone=S.tasks.some(t=>t.subjectId===sj.id&&t.done);
  return '<div class="pill" data-sid="'+sj.id+'" style="--c:'+sj.color+'">'+
    '<span class="pname">'+nameHTML(sj)+'</span>'+
    (hasDone?'<span class="pcheck" title="alles erledigt">✓</span>':'')+
    '<button class="icon" data-act="menu" aria-label="Fach-Menü">⋯</button>'+
    '<button class="icon plus" data-act="add-task" aria-label="Aufgabe hinzufügen">+</button>'+
    menuHTML(sj)+
  '</div>';
}

function ghostPill(){
  return ui.addingSubject
    ? '<div class="pill ghostp"><input data-newsubject placeholder="Name des Fachs …" maxlength="40"></div>'
    : '<button class="pill ghostp" data-act="add-subject">+ Fach</button>';
}

function viewAktiv(){
  const tile=sharedTile();
  if(!S.subjects.length){
    return (tile?'<div class="cols">'+tile+'</div>':'')+'<div class="empty"><h2>Noch ein leeres Board.</h2><p>Leg dein erstes Fach an, so wie es in deinem Stundenplan steht. Fächer mit offenen Aufgaben bekommen eine eigene Kachel.</p>'+
      (ui.addingSubject?ghostPill():'<button class="primary" data-act="add-subject">+ Erstes Fach anlegen</button>')+'</div>';
  }
  const active=[], rest=[];
  S.subjects.forEach(sj=>{ (S.tasks.some(t=>t.subjectId===sj.id&&!t.done)?active:rest).push(sj); });
  let html='';
  if(active.length||tile) html+='<div class="cols">'+tile+active.map(colHTML).join('')+'</div>';
  else html+='<div class="hint">Gerade ist nichts offen. Plus bei einem Fach, wenn dir was einfällt.</div>';
  html+='<div class="rest">'+(rest.length?'<div class="restlabel">Nichts offen</div>':'')+'<div class="pills">'+rest.map(pillHTML).join('')+ghostPill()+'</div></div>';
  return html;
}

function viewFaellig(){
  const open=S.tasks.filter(t=>!t.done&&match(t));
  const withDue=open.filter(t=>t.due).sort((a,b)=>a.due<b.due?-1:a.due>b.due?1:0);
  const noDueList=open.filter(t=>!t.due).sort((a,b)=>S.subjects.findIndex(s=>s.id===a.subjectId)-S.subjects.findIndex(s=>s.id===b.subjectId));
  const groups=[
    ['Überfällig','over',withDue.filter(t=>diffDays(t.due)<0)],
    ['Heute','',withDue.filter(t=>diffDays(t.due)===0)],
    ['Morgen','',withDue.filter(t=>diffDays(t.due)===1)],
    ['Diese Woche','',withDue.filter(t=>{const n=diffDays(t.due);return n>=2&&n<=7;})],
    ['Später','',withDue.filter(t=>diffDays(t.due)>7)],
    ['Ohne Deadline','',noDueList]
  ].filter(g=>g[2].length);
  if(!groups.length){
    return '<div class="empty"><h2>Nichts offen.</h2><p>Hier siehst du alle offenen Aufgaben aus allen Fächern, nach Deadline sortiert. Aufgaben ohne Datum stehen ganz unten.</p></div>';
  }
  return '<div class="soon-wrap">'+groups.map(g=>'<h3 class="'+g[1]+'">'+g[0]+' <small>'+g[2].length+'</small></h3><div class="stack">'+g[2].map(t=>taskHTML(t,{showSubject:true})).join('')+'</div>').join('')+'</div>';
}

function viewErledigt(){
  const cols=S.subjects.map(sj=>{
    const d=S.tasks.filter(t=>t.subjectId===sj.id&&t.done&&match(t)).sort((a,b)=>(b.doneAt||0)-(a.doneAt||0));
    if(!d.length) return '';
    return '<section class="col" data-sid="'+sj.id+'" style="--c:'+sj.color+'"><header class="colhead"><div class="ctitle">'+esc(sj.name)+'</div><span class="count">'+d.length+' erledigt</span></header><div class="list" style="padding-top:8px">'+d.map(t=>taskHTML(t,{})).join('')+'</div></section>';
  }).join('');
  if(!cols) return '<div class="empty"><h2>Noch nichts erledigt.</h2><p>Das ändert sich gleich. Alles, was du abhakst, landet hier als dein Archiv.</p></div>';
  return '<div class="cols">'+cols+'</div>';
}

function updateHeader(){
  const now=new Date();
  const open=S.tasks.filter(t=>!t.done);
  const urgent=open.filter(t=>t.due&&diffDays(t.due)<=0).length;
  const today=S.tasks.filter(t=>t.done&&t.doneAt&&fmtDate(new Date(t.doneAt))===todayStr()).length;
  const parts=[WDL[now.getDay()]+', '+now.getDate()+'. '+MONTHS[now.getMonth()]];
  if(open.length) parts.push(open.length+' offen');
  if(open.length) parts.push(urgent?urgent+' heute dran oder überfällig':'heute nichts Dringendes');
  if(today) parts.push(today+' heute geschafft');
  $('#stats').textContent=parts.join('  ·  ');
  const soonN=open.filter(t=>t.due&&diffDays(t.due)<=7).length;
  $('#n_aktiv').textContent=open.length||'';
  $('#n_faellig').textContent=soonN||'';
  $('#n_erledigt').textContent=S.tasks.length-open.length||'';
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===ui.tab));
  const bk=$('#bk');
  let label='Backup', warn=false;
  if(!DEV.lastBackup){label='Backup: noch nie';warn=S.tasks.length>0;}
  else{const n=-diffDays(fmtDate(new Date(DEV.lastBackup)));label='Backup: '+(n===0?'heute':n===1?'gestern':'vor '+n+' Tagen');warn=n>14&&MODE!=='remote';}
  if(MODE==='remote') warn=false;
  $('#bklabel').textContent=label; bk.classList.toggle('warn',warn);
  let th=DEV.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
  if(THEMES.indexOf(th)<0) th='light';
  document.documentElement.dataset.theme=th;
  $('#theme').textContent=TLABEL[th];
  $('#tc').setAttribute('content',TCOLOR[th]);
  $('#whoname').textContent=whoName;
  $('#logoutbtn').hidden=MODE!=='remote';
  updateSync();
}

function render(){
  updateHeader();
  const b=$('#board');
  const ae=document.activeElement; const keep=(ae&&ae.matches&&ae.matches('[data-shnew]'))?{v:ae.value,s:ae.selectionStart}:null;
  b.innerHTML=ui.tab==='aktiv'?viewAktiv():ui.tab==='faellig'?viewFaellig():viewErledigt();
  if(keep){const i=b.querySelector('[data-shnew]'); if(i){i.value=keep.v; i.focus(); try{i.setSelectionRange(keep.s,keep.s);}catch(e){}}}
  else if(ui.shFocusNew){const i=b.querySelector('[data-shnew]'); if(i)i.focus();}
  ui.shFocusNew=false;
  if(ui.shEdit){const i=b.querySelector('[data-shedit]'); if(i){i.focus(); i.select();}}
  if(ui.focusSub){const i=b.querySelector('.task[data-id="'+ui.focusSub+'"] .subadd'); if(i)i.focus(); ui.focusSub=null;}
  if(ui.addingSubject){const i=b.querySelector('[data-newsubject]'); if(i)i.focus();}
  if(ui.renaming){const i=b.querySelector('#rn'); if(i){i.focus();i.select();}}
}

/* ---------- Aktionen ---------- */
function completeTask(id){
  const t=taskById(id); if(!t||t.done) return;
  snap(); t.done=true; t.doneAt=Date.now(); save(); render();
  const left=S.tasks.filter(x=>x.subjectId===t.subjectId&&!x.done).length;
  toast(left===0?'Fach komplett erledigt. Gönn dir kurz eine Pause.':CHEERS[Math.floor(Math.random()*CHEERS.length)],true);
}
function reopenTask(id){const t=taskById(id); if(!t)return; snap(); t.done=false; delete t.doneAt; save(); render(); toast('Wieder offen.',true);}
function deleteTask(id){snap(); S.tasks=S.tasks.filter(t=>t.id!==id); ui.expanded.delete(id); save(); render(); toast('Aufgabe gelöscht.',true);}
function moveTask(id,sid,beforeId){
  const i=S.tasks.findIndex(t=>t.id===id); if(i<0) return;
  const t=S.tasks.splice(i,1)[0]; t.subjectId=sid;
  let idx=beforeId?S.tasks.findIndex(x=>x.id===beforeId):-1;
  if(idx<0){let last=-1; S.tasks.forEach((x,k)=>{if(x.subjectId===sid)last=k;}); idx=last+1;}
  S.tasks.splice(idx,0,t);
}
function addSubject(name){
  name=name.trim(); if(!name) return;
  S.subjects.push({id:uidGen(),name:name,color:COLORS[S.subjects.length%COLORS.length]});
  save();
}

/* ---------- Gemeinsame Kachel (Essensplan) ---------- */
/* Eigene Tabelle shared_items: eine Zeile pro Eintrag, damit sich Stiven und Marit nicht gegenseitig überschreiben. */
const CHECKSVG='<svg viewBox="0 0 24 24" width="13" height="13"><path pathLength="1" d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
function otherName(){const o=PROFILES.find(p=>p.name!==whoName); return o?o.name:'';}
function shNew(it){return !!(it.data&&it.data.by&&it.data.by!==whoName&&(it.data.at||0)>shSeen);}
function dayLabel(ds){const n=diffDays(ds); return n===0?'heute':n===1?'morgen':WD[parse(ds).getDay()]+' '+dm(ds);}
function shDescribe(n){
  const d=n.data;
  if(n.kind==='meal') return d.by+': Essen '+dayLabel(n.id.slice(5))+' - '+d.text;
  return d.done?d.by+' hat erledigt: '+d.title:d.by+': '+d.title;
}
function busyTyping(){
  const a=document.activeElement;
  return dlg.open||!!(a&&a.matches&&a.matches('[data-shedit],[data-subadd],[data-newsubject],[data-rename],#rn'));
}

function shLoadCache(){
  try{SH=JSON.parse(localStorage.getItem(SHKEY+'_'+uid)||'{}')||{};}catch(e){SH={};}
  try{shPend=JSON.parse(localStorage.getItem(SHPEND+'_'+uid)||'{}')||{};}catch(e){shPend={};}
  let s=null; try{s=localStorage.getItem(SHSEEN+'_'+uid);}catch(e){}
  shSeen=s?(Number(s)||0):0; shSeenFresh=!s;
}
function shSave(){
  if(!uid) return;
  try{localStorage.setItem(SHKEY+'_'+uid,JSON.stringify(SH)); localStorage.setItem(SHPEND+'_'+uid,JSON.stringify(shPend));}catch(e){}
}
function shStart(){
  shLoaded=false; shMissing=false; shLoadCache();
  if(!shChan&&sb&&sb.channel){
    try{ shChan=sb.channel('shared-items').on('postgres_changes',{event:'*',schema:'public',table:'shared_items'},function(){ if(!document.hidden) shPull(); }).subscribe(); }
    catch(e){ shChan=null; }
  }
  shPull();
}
function shStop(){
  if(shChan){ try{sb.removeChannel(shChan);}catch(e){} shChan=null; }
  clearTimeout(shTimer); clearTimeout(shRetry);
  SH={}; shPend={}; shLoaded=false;
}
function shMarkSeen(rerender){
  if(!uid) return;
  const had=Object.values(SH).some(shNew);
  shSeen=Date.now(); try{localStorage.setItem(SHSEEN+'_'+uid,String(shSeen));}catch(e){}
  if(rerender&&had) render();
}

function shSchedule(){ clearTimeout(shTimer); shTimer=setTimeout(shFlush,400); }
function shPut(it){ SH[it.id]=it; shPend[it.id]={op:'up'}; shSave(); setSync('pending'); shSchedule(); }
function shRemove(id){ delete SH[id]; shPend[id]={op:'del'}; shSave(); shSchedule(); }

async function shFlush(){
  if(!sb||!session) return;
  if(shBusy){shAgain=true;return;}
  const ids=Object.keys(shPend); if(!ids.length) return;
  shBusy=true;
  try{
    for(const id of ids){
      const p=shPend[id]; if(!p) continue;
      let r;
      if(p.op==='del'){ r=await sb.from('shared_items').delete().eq('id',id); }
      else{
        const it=SH[id]; if(!it){ delete shPend[id]; continue; }
        r=await sb.from('shared_items').upsert({id:id,kind:it.kind,data:it.data,updated_by:whoName,updated_at:new Date().toISOString()},{onConflict:'id'});
      }
      if(r&&r.error) throw r.error;
      if(shPend[id]===p) delete shPend[id];
      shSave();
    }
    if(!dirty&&!Object.keys(shPend).length) setSync('ok');
  }catch(e){
    setSync('offline'); clearTimeout(shRetry); shRetry=setTimeout(shFlush,20000);
  }
  shBusy=false;
  if(shAgain){shAgain=false; shFlush();}
}

async function shPull(){
  if(!sb||!session||shPulling) return;
  shPulling=true;
  try{
    if(Object.keys(shPend).length) await shFlush();
    let r;
    try{ r=await sb.from('shared_items').select('id,kind,data,updated_by,updated_at'); }
    catch(e){ setSync('offline'); return; }
    if(r.error){
      if(/does not exist|schema cache|could not find|relation/i.test(r.error.message||'')){ if(!shMissing){shMissing=true; render();} }
      else setSync('offline');
      return;
    }
    if(shMissing){shMissing=false; render();}
    if(shSeenFresh){ shSeen=Date.now(); try{localStorage.setItem(SHSEEN+'_'+uid,String(shSeen));}catch(e){} shSeenFresh=false; }
    const fresh={};
    (r.data||[]).forEach(x=>{ fresh[x.id]={id:x.id,kind:x.kind,data:x.data||{}}; });
    Object.keys(shPend).forEach(id=>{ if(shPend[id].op==='del') delete fresh[id]; else if(SH[id]) fresh[id]=SH[id]; });
    const sig=o=>JSON.stringify(Object.keys(o).sort().map(k=>[k,o[k].data]));
    if(sig(fresh)!==sig(SH)){
      if(busyTyping()) return;               // nicht mitten im Tippen umschalten, der nächste Abgleich holt es nach
      if(shLoaded){
        const ch=[];
        Object.keys(fresh).forEach(id=>{ const n=fresh[id], o=SH[id]; if(n.data.by&&n.data.by!==whoName&&(!o||o.data.at!==n.data.at)) ch.push(n); });
        if(ch.length) toast(ch.length===1?shDescribe(ch[0]):ch.length+' Änderungen von '+ch[0].data.by,false);
      }
      SH=fresh; shSave(); render();
    }
    shLoaded=true;
    if(syncState==='offline'&&!dirty&&!Object.keys(shPend).length) setSync('ok');
    shPrune();
  } finally { shPulling=false; }
}
function shPrune(){
  const cut=addDays(-14), old=Date.now()-30*86400000;
  Object.keys(SH).forEach(id=>{
    const it=SH[id];
    if(id.indexOf('meal-')===0&&id.slice(5)<cut) shRemove(id);
    else if(it.kind==='task'&&it.data.done&&(it.data.doneAt||0)<old) shRemove(id);
  });
}

function shCommitEdit(id,val){
  val=(val||'').trim();
  if(id.indexOf('meal-')===0){
    const old=SH[id];
    if(!val){ if(old) shRemove(id); return; }
    if(old&&old.data.text===val) return;
    shPut({id:id,kind:'meal',data:{text:val,by:whoName,at:Date.now()}});
  }else{
    const it=SH[id]; if(!it||!val||it.data.title===val) return;
    shPut({id:id,kind:'task',data:Object.assign({},it.data,{title:val,by:whoName,at:Date.now()})});
  }
}
function shAddTask(v){
  const now=Date.now();
  shPut({id:'t'+uidGen(),kind:'task',data:{title:v,done:false,by:whoName,at:now,created:now}});
  ui.shFocusNew=true; render();
}
function shToggle(id){
  const it=SH[id]; if(!it) return;
  const done=!it.data.done, now=Date.now();
  const d=Object.assign({},it.data,{done:done,by:whoName,at:now});
  if(done) d.doneAt=now; else delete d.doneAt;
  shPut({id:id,kind:it.kind,data:d}); render();
}
function shDelete(id){
  const it=SH[id]; if(!it) return;
  shDel=it; shRemove(id); render(); toast('Gelöscht.',true,'sh-undo');
}
function shUndo(){
  if(!shDel) return;
  shPut(shDel); shDel=null; hideToast(); render();
}

function mealRow(offset){

function shTaskHTML(it){

function sharedTile(){
  if(MODE!=='remote') return '';
  const q=ui.q.trim().toLowerCase();
  const tasks=Object.values(SH).filter(x=>x.kind==='task');
  const open=tasks.filter(x=>!x.data.done&&(!q||(x.data.title||'').toLowerCase().includes(q)))
    .sort((a,b)=>(a.data.created||a.data.at||0)-(b.data.created||b.data.at||0));
  const done=tasks.filter(x=>x.data.done).sort((a,b)=>(b.data.doneAt||0)-(a.data.doneAt||0));
  const o=otherName(), anyNew=Object.values(SH).some(shNew);
  let h='<section class="col shared" style="--c:#d1a24a">'+
    '<header class="colhead"><div class="ctitle">Essensplan</div><span class="count">'+(open.length?open.length+' offen':'')+'</span></header>'+
    '<div class="shsub">Gemeinsam'+(o?' mit '+esc(o):'')+(anyNew?' · <button class="linkb" data-act="sh-seen">alles gesehen</button>':'')+'</div>'+
    '<div class="meals">'+mealRow(0)+mealRow(1)+'</div>';
  if(shMissing) h+='<div class="hint">Die gemeinsame Tabelle fehlt noch in Supabase. Bitte das SQL dafür ausführen.</div>';
  h+='<div class="stasks">'+open.map(shTaskHTML).join('')+'</div>';
  if(done.length){
    h+='<button class="shmore" data-act="sh-more">'+(ui.shDone?'Erledigte ausblenden':done.length+' erledigt anzeigen')+'</button>';
    if(ui.shDone) h+='<div class="stasks">'+done.slice(0,15).map(shTaskHTML).join('')+'</div>';
  }
  h+='<input class="shadd" data-shnew placeholder="Gemeinsame Aufgabe hinzufügen …" maxlength="150">';
  return h+'</section>';
}

function showLogin(msg){
  document.body.classList.add('locked');
  $('#login').hidden=false;
  let last=''; try{last=localStorage.getItem(LASTNAME)||'';}catch(e){}
  $('#l_name').value=last; $('#l_code').value=''; $('#l_err').textContent=msg||'';
  markQuick();
  (last?$('#l_code'):$('#l_name')).focus();
}
function markQuick(){
  const v=$('#l_name').value.trim().toLowerCase();
  document.querySelectorAll('#l_quick button').forEach(b=>b.classList.toggle('on',b.dataset.name.toLowerCase()===v));
}
function buildQuick(){
  $('#l_quick').innerHTML=PROFILES.map(p=>'<button type="button" data-name="'+esc(p.name)+'">'+esc(p.name)+'</button>').join('');
}
async function login(name,code){
  const p=PROFILES.find(x=>x.name.toLowerCase()===name.trim().toLowerCase());
  if(!p) return 'Den Namen kenne ich nicht.';
  if(!code) return 'Gib deinen Code ein.';
  let res;
  try{ res=await sb.auth.signInWithPassword({email:p.email,password:code}); }
  catch(e){ return 'Keine Verbindung. Versuch es gleich nochmal.'; }
  if(res.error){
    return /invalid login|credentials/i.test(res.error.message||'')?'Name oder Code stimmt nicht.':'Anmeldung nicht möglich: '+res.error.message;
  }
  try{localStorage.setItem(LASTNAME,p.name);}catch(e){}
  await enter(res.data.session);
  return '';
}
async function enter(sess){
  session=sess; uid=sess.user.id;
  const em=(sess.user.email||'').toLowerCase();
  const p=PROFILES.find(x=>x.email.toLowerCase()===em);
  whoName=p?p.name:(sess.user.email||'?');
  cacheKey='lernboard_cache_'+uid; remoteTs=null;
  let cached=null; try{cached=JSON.parse(localStorage.getItem(cacheKey)||'null');}catch(e){}
  S=cached?{subjects:cached.subjects||[],tasks:cached.tasks||[]}:blank();
  let d=false; try{d=localStorage.getItem(cacheKey+'_dirty')==='1';}catch(e){}
  dirty=d;
  $('#login').hidden=true; document.body.classList.remove('locked');
  ui.expanded.clear(); ui.menu=null; ui.addingSubject=false; ui.renaming=null; undoSnap=null;
  setSync(dirty?'pending':'ok');
  shStart();
  render();
  await pull();
}
async function logout(){
  $('#whomenu').hidden=true;
  if(Object.keys(shPend).length){
    await shFlush();
    if(Object.keys(shPend).length&&!confirm('Es gibt noch gemeinsame Änderungen, die nicht gespeichert werden konnten (offline?). Trotzdem abmelden?')) return;
  }
  if(dirty){
    await push();
    if(dirty&&!confirm('Es gibt noch Änderungen, die nicht gespeichert werden konnten (offline?). Trotzdem abmelden?')) return;
  }
  try{localStorage.removeItem(cacheKey);localStorage.removeItem(cacheKey+'_dirty');}catch(e){}
  try{localStorage.removeItem(SHKEY+'_'+uid);localStorage.removeItem(SHPEND+'_'+uid);localStorage.removeItem(SHSEEN+'_'+uid);}catch(e){}
  shStop();
  const s=sb; session=null; uid=null; S=blank(); whoName='Lokal';
  try{await s.auth.signOut();}catch(e){}
  showLogin();
}
async function push(){
  if(!sb||!session) return;
  if(pushing){again=true;return;}
  pushing=true; clearTimeout(pushT);
  try{
    const r=await sb.from('boards').upsert({user_id:uid,data:pay(),updated_at:new Date().toISOString()},{onConflict:'user_id'}).select('updated_at').single();
    if(r.error) throw r.error;
    remoteTs=r.data.updated_at;
    if(!again){setDirty(false); setSync('ok');}
  }catch(e){
    setSync('offline');
    clearTimeout(retryT); retryT=setTimeout(()=>{if(dirty)push();},20000);
  }
  pushing=false;
  if(again){again=false;push();}
}
async function pull(){
  if(!sb||!session) return;
  if(dirty){await push(); return;}
  let r;
  try{ r=await sb.from('boards').select('data,updated_at').eq('user_id',uid).maybeSingle(); }
  catch(e){ setSync('offline'); return; }
  if(r.error){ setSync('offline'); return; }
  if(!r.data){ setDirty(true); await push(); return; }  // erster Login: Zeile anlegen
  if(r.data.updated_at!==remoteTs){
    const typing=dlg.open||(document.activeElement&&/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName));
    if(typing) return;  // nicht mitten im Tippen umschalten, nächster Abgleich holt es nach
    remoteTs=r.data.updated_at;
    const d=r.data.data||{};
    S={subjects:d.subjects||[],tasks:d.tasks||[]};
    try{localStorage.setItem(cacheKey,JSON.stringify(pay()));}catch(e){}
    undoSnap=null; render();
  }
  setSync('ok');
}

/* ---------- Events ---------- */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');
  const act=el?el.dataset.act:null;
  const art=el?el.closest('.task'):null, tid=art?art.dataset.id:null;
  const colEl=el?el.closest('[data-sid]'):null, sid=colEl?colEl.dataset.sid:null;
  const subId=el?el.dataset.sub:null, color=el?el.dataset.color:null;
  const shEl=el?el.closest('[data-shid]'):null, shid=shEl?shEl.dataset.shid:null;

  if(!e.target.closest('#bkmenu')&&act!=='bkmenu') $('#bkmenu').hidden=true;
  if(!e.target.closest('#whomenu')&&act!=='whomenu') $('#whomenu').hidden=true;
  if(ui.menu&&!e.target.closest('.menu')&&act!=='menu'){ui.menu=null; if(!act)render();}
  if(!act) return;

  switch(act){
    case 'toggle': if(art.classList.contains('completing'))return; art.classList.add('completing'); setTimeout(()=>completeTask(tid),380); break;
    case 'reopen': reopenTask(tid); break;
    case 'expand':
      if(e.target.closest('.detail')||e.target.closest('a')) return;
      if(ui.expanded.has(tid))ui.expanded.delete(tid); else ui.expanded.add(tid); render(); break;
    case 'edit': openDialog({id:tid}); break;
    case 'del': deleteTask(tid); break;
    case 'sub-toggle': {const t=taskById(tid); const s=t&&t.subs.find(x=>x.id===subId); if(s){s.done=el.checked; save(); render();} break;}
    case 'sub-del': {e.preventDefault(); const t=taskById(tid); if(t){t.subs=t.subs.filter(x=>x.id!==subId); save(); render();} break;}
    case 'add-task': openDialog({sid:sid}); break;
    case 'menu': ui.menu=ui.menu===sid?null:sid; render(); break;
    case 'rename': ui.renaming=sid; ui.menu=null; render(); break;
    case 'color': {const s=subj(sid); if(s){s.color=color; save(); ui.menu=null; render();} break;}
    case 'del-subject': {
      const n=S.tasks.filter(t=>t.subjectId===sid).length;
      if(n&&!confirm('Dieses Fach samt '+n+' Aufgabe'+(n>1?'n':'')+' löschen?')) {ui.menu=null;render();break;}
      snap(); S.subjects=S.subjects.filter(s=>s.id!==sid); S.tasks=S.tasks.filter(t=>t.subjectId!==sid); ui.menu=null; save(); render(); toast('Fach gelöscht.',true); break;
    }
    case 'add-subject': ui.addingSubject=true; render(); break;
    case 'undo': undo(); break;
    case 'sh-edit': ui.shEdit=shid; render(); break;
    case 'sh-toggle': shToggle(shid); break;
    case 'sh-del': shDelete(shid); break;
    case 'sh-undo': shUndo(); break;
    case 'sh-more': ui.shDone=!ui.shDone; render(); break;
    case 'sh-seen': shMarkSeen(true); break;
    case 'whomenu': updateSync(); $('#whomenu').hidden=!$('#whomenu').hidden; break;
    case 'logout': logout(); break;
    case 'bkmenu': $('#bkmenu').hidden=!$('#bkmenu').hidden; break;
    case 'export': $('#bkmenu').hidden=true; exportData(); break;
    case 'import': $('#bkmenu').hidden=true; $('#file').click(); break;
  }
});

document.addEventListener('keydown',e=>{
  const t=e.target;
  if(t.matches&&t.matches('[data-subadd]')&&e.key==='Enter'){
    const v=t.value.trim(); if(!v) return;
    const id=t.closest('.task').dataset.id, task=taskById(id);
    if(task){(task.subs=task.subs||[]).push({id:uidGen(),t:v,done:false}); save(); ui.focusSub=id; render();}
    return;
  }
  if(t.matches&&t.matches('[data-shnew]')){
    if(e.key==='Enter'){const v=t.value.trim(); if(v){t.value=''; shAddTask(v);}}
    return;
  }
  if(t.matches&&t.matches('[data-shedit]')){
    if(e.key==='Enter'){const id=ui.shEdit; ui.shEdit=null; if(id)shCommitEdit(id,t.value); render();}
    else if(e.key==='Escape'){ui.shEdit=null; render();}
    return;
  }
  if(t.matches&&t.matches('[data-newsubject]')){
    if(e.key==='Enter'){addSubject(t.value); ui.addingSubject=false; render();}
    else if(e.key==='Escape'){ui.addingSubject=false; render();}
    return;
  }
  if(t.matches&&t.matches('[data-rename]')){
    if(e.key==='Enter'){t.blur();}
    else if(e.key==='Escape'){ui.renaming=null; render();}
    return;
  }
  if(document.body.classList.contains('locked')) return;
  const typing=/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)||dlg.open;
  if(e.key==='Escape'){ui.menu=null;$('#bkmenu').hidden=true;$('#whomenu').hidden=true; if(!dlg.open)render(); return;}
  if(typing) return;
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();undo();return;}
  if(e.ctrlKey||e.metaKey||e.altKey) return;
  if(e.key==='n'||e.key==='N'){e.preventDefault();openDialog();}
  else if(e.key==='/'){e.preventDefault();$('#q').focus();}
  else if(e.key==='1')setTab('aktiv'); else if(e.key==='2')setTab('faellig'); else if(e.key==='3')setTab('erledigt');
});

document.addEventListener('focusout',e=>{
  const t=e.target;
  if(t.matches&&t.matches('[data-shedit]')&&ui.shEdit){
    const id=ui.shEdit; ui.shEdit=null; shCommitEdit(id,t.value); render(); return;
  }
  if(t.matches&&t.matches('[data-rename]')&&ui.renaming){
    const s=subj(ui.renaming), v=t.value.trim();
    if(s&&v&&v!==s.name){s.name=v; save();}
    ui.renaming=null; render();
  } else if(t.matches&&t.matches('[data-newsubject]')&&ui.addingSubject){
    if(t.value.trim()) addSubject(t.value);
    ui.addingSubject=false; render();
  }
});

function setTab(t){ui.tab=t; DEV.tab=t; saveDev(); render();}
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('[data-tab]'); if(b)setTab(b.dataset.tab);});
$('#q').addEventListener('input',e=>{ui.q=e.target.value; render();});
$('#q').addEventListener('keydown',e=>{if(e.key==='Escape'){e.target.value='';ui.q='';e.target.blur();render();}});
$('#theme').addEventListener('click',()=>{const cur=document.documentElement.dataset.theme; DEV.theme=THEMES[(THEMES.indexOf(cur)+1)%THEMES.length]; saveDev(); updateHeader();});

/* ---------- Drag & Drop (nur Maus-Geräte) ---------- */
let dragId=null, ph=null;
function cleanup(){
  dragId=null; if(ph&&ph.parentNode)ph.remove(); ph=null;
  document.querySelectorAll('.dragging,.list.over,.pill.over').forEach(x=>x.classList.remove('dragging','over'));
}
document.addEventListener('dragstart',e=>{
  const a=e.target.closest&&e.target.closest('.task[draggable=true]'); if(!a) return;
  dragId=a.dataset.id; e.dataTransfer.effectAllowed='move'; e.dataTransfer.setData('text/plain',dragId);
  setTimeout(()=>a.classList.add('dragging'),0);
});
document.addEventListener('dragover',e=>{
  if(!dragId) return;
  const l=e.target.closest('.list, .pill'); if(!l) return;
  e.preventDefault();
  document.querySelectorAll('.list.over,.pill.over').forEach(x=>{if(x!==l)x.classList.remove('over');});
  l.classList.add('over');
  if(l.classList.contains('pill')){ if(ph&&ph.parentNode)ph.remove(); return; }
  let before=null;
  for(const el of l.querySelectorAll('.task:not(.dragging)')){const r=el.getBoundingClientRect(); if(e.clientY<r.top+r.height/2){before=el;break;}}
  if(!ph){ph=document.createElement('div');ph.className='ph';}
  const col=l.closest('.col'); if(col) ph.style.setProperty('--c',getComputedStyle(col).getPropertyValue('--c'));
  if(before) l.insertBefore(ph,before); else l.appendChild(ph);
});
document.addEventListener('drop',e=>{
  if(!dragId) return;
  const l=e.target.closest('.list, .pill'); if(!l) return;
  e.preventDefault();
  const id=dragId, sid=l.dataset.sid; let beforeId=null;
  if(ph&&ph.parentNode===l){const n=ph.nextElementSibling; if(n&&n.classList.contains('task'))beforeId=n.dataset.id;}
  moveTask(id,sid,beforeId); cleanup(); save(); render();
});
document.addEventListener('dragend',cleanup);

/* ---------- Sync & Zeit ---------- */
window.addEventListener('storage',e=>{if(MODE==='local'&&e.key===KEY){S=loadLocal(); render();}});
function refresh(){ if(MODE==='remote'&&session&&!document.hidden){pull(); shPull();} if(todayStr()!==lastDay){lastDay=todayStr();render();} }
document.addEventListener('visibilitychange',refresh);
window.addEventListener('focus',refresh);
window.addEventListener('online',()=>{if(MODE==='remote'&&session){if(dirty)push(); else pull(); shFlush(); shPull();}});
setInterval(refresh,120000);
setInterval(function(){ if(MODE==='remote'&&session&&!document.hidden) shPull(); },15000);
document.addEventListener('visibilitychange',function(){ if(document.hidden) shMarkSeen(false); });
window.addEventListener('pagehide',function(){ shMarkSeen(false); });

/* ---------- Start ---------- */
(async function boot(){
  buildQuick();
  if(!CONFIGURED){
    MODE='local'; whoName='Lokal'; S=loadLocal(); render(); return;
  }
  MODE='remote';
  document.body.classList.add('locked');
  if(!window.supabase){ showLogin('Supabase konnte nicht geladen werden. Internetverbindung prüfen und Seite neu laden.'); return; }
  sb=window.supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
  sb.auth.onAuthStateChange(ev=>{ if(ev==='SIGNED_OUT'&&session){ shStop(); session=null; showLogin('Du wurdest abgemeldet.'); } });
  let s=null;
  try{ const r=await sb.auth.getSession(); s=r.data&&r.data.session; }catch(e){}
  if(s) await enter(s); else showLogin();
})();
})();
</script>

if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  window.addEventListener('load',function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
}
